fidelity:
  divergences: >-
    The finite-puncture metrics are assumed to exist with explicitly listed
    curvature -1 properties, rather than constructed from universal coverings.
    Area is divided by 2*pi, so a plane with m punctures has mass m-1.
    Local functions are total functions on C required analytic only near closure(V).
    Orbit components lie in one compact K contained in V. The entire result assumes
    boundedness of the union of the components, not just of individual point orbits.
    Simple connectivity and radius-dependent eventual injectivity remain hypotheses.
    No assertion removing these assumptions is represented by the theorem names.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Local Lean compilation and standard-axiom checks are recorded in VERIFICATION.md.
    The local declaration audit compares exported elaborated types and definition
    bodies from the two separate environments. It is not Palomar Comparator or
    NanoDa. No public submission, external Comparator run, registry acceptance or
    independent human review is claimed.

