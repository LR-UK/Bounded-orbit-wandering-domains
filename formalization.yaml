    This paper [PRW] is the source of the original bounded-orbit results. The present extension
    proves the derived-singular-set assertion announced there without proof,
    removes unnecessary local hypotheses, extends the local results to arbitrary
    Riemann surfaces, adds the positive-area result and classical no-wandering
    corollaries. Surface derived-set accumulation assumes simply connected
    component orbits. The exact independent statements are in Challenge.lean,
    with proofs exposed by Solution.lean. The authors of [PRW] and [DPU] are preparing a joint preprint containing
    these results. No independent human review or acceptance of this
    updated package is claimed.
