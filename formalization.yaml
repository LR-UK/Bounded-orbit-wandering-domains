fidelity:
  divergences: All selected statements have independent explicit Lean specifications. Positive area means
    positive Lebesgue area in a coordinate chart. Surface escape uses the one-point compactification and
    is proved equivalent to eventual compact avoidance along the selected subsequence. The compact positive-area
    proof uses three anchors and their backward preimages, a finite-end normal-family argument, and uniform
    finite puncture area bounds; separate sphere and torus periodic-orbit classifications are unnecessary.
    The entire derived-singular theorem follows from the previously verified stronger locally uniform
    theorem. The rational corollary uses open holomorphic self-maps of the compact sphere; its complex
    atlas is universally quantified and in particular may be the standard sphere atlas. No equivalence
    theorem with a polynomial-quotient representation is asserted. The entire finite-type theorem explicitly
    assumes transcendence, as does the new meromorphic class S corollary. The meromorphic singular set
    is defined on the sphere through local coverings of the honest sphere-valued function,
    allowing empty sheets. Values outside the closure of the image are regular.
    The finite-type surface theorem needs a compact target, but no maximality or simple-connectivity assumption
    on the open source. No custom mathematical axioms are used.
review:
  status: self-assessed
  reviewers: []
  notes: Lean builds, transitive axiom audits, independent Challenge/Solution declaration comparison and
    metadata validation are recorded in docs/VERIFICATION.md. Official Comparator and independent-kernel
    replay status is recorded there separately. Local verification is distinct from independent human
    review and registry acceptance of this version.
