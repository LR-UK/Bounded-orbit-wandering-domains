status:
  scope: >-
    Two conditional absence results are proved: local trapped components compactly
    contained in an analytic neighbourhood, and genuine Fatou-component orbits of
    a transcendental entire function when one point in the initial component has
    a bounded forward orbit. No boundedness of the union of Fatou components is
    assumed in the entire theorem. Only the local theorem retains simple
    connectivity and eventual injectivity on each fixed intrinsic disc as
    hypotheses. The entire theorem constructs auxiliary trapped components,
    derives their simple connectivity by maximum modulus and planar topology,
    and proves eventual injectivity on shrinking discs using local power
    coordinates and holomorphic root branches. ClassicalHyperbolicMetrics is an
    explicit theorem hypothesis. All area-deficit, limiting-density and dynamical
    deductions are proved. The derived-singular-set theorem is not included.
    Challenge.lean has two intentional proof holes and is not imported by Solution.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "BoundedWanderingDomains.no_local_bounded_wandering_domains"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "BoundedWanderingDomains.no_bounded_wandering_domains_transcendental_entire"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]

