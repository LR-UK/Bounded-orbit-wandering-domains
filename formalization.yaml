fidelity:
  divergences: >-
    The six introductory statements have independent explicit Lean definitions.
    Positive area means positive Lebesgue area in a coordinate chart. Surface
    escape uses the one-point compactification and is proved equivalent to eventual
    compact avoidance. The compact positive-area proof uses three anchors and their
    backward preimages, a finite-end normal-family argument, and uniform finite
    puncture area bounds; separate sphere and torus periodic-orbit classifications
    are unnecessary. The entire derived-singular theorem follows from the previously
    verified stronger locally uniform theorem. The rational corollary uses open holomorphic
    self-maps of the compact sphere; its complex atlas is universally quantified
    and in particular may be the standard sphere atlas. No equivalence theorem
    with a polynomial-quotient representation is asserted. The entire finite-type
    theorem explicitly assumes transcendence. No custom mathematical axioms are used.

