    status is recorded there separately. No independent human review, Palomar acceptance or public submission
    is claimed.
alignment:
  namespace: Revised paper challenge
  statements:
  - source: Theorem 1.2, entire case
    lean: BoundedWanderingDomains.theorem_1_2_entire
    module: Solution
    status: proved
    note: The independent challenge statement has a proved source theorem giving locally uniform escape.
  - source: Theorem 1.2, meromorphic case
    lean: MeromorphicDynamics.theorem_1_2_meromorphic
    module: Solution
    status: proved
    note: Proved from Theorem 1.3(1) through the meromorphic sphere model.
  - source: Theorem 1.3(1), compact avoidance on a Riemann surface
    lean: SurfaceDynamics.theorem_1_3_orbit
    module: Solution
    status: proved
    note: Every orbit in a wandering component leaves each compact subset of the actual source O.
  - source: Theorem 1.3(2), positive-area wandering set
    lean: SurfaceDynamics.theorem_1_3_positive_area
    module: Solution
    status: proved
    note: The forward saturation is not contained in a compact subset of O.
  - source: Theorem 1.4, entire derived singular accumulation
    lean: BoundedWanderingDomains.theorem_1_4
    module: Solution
    status: proved
    note: A stronger locally uniform source theorem is already proved.
  - source: Theorem 1.5, surface derived singular accumulation or compact escape
    lean: SurfaceDynamics.theorem_1_5
    module: Solution
    status: proved
    note: Simple connectivity is assumed only for normality components met by the orbit.
  - source: Original entire-function bounded-orbit theorem
    lean: BoundedWanderingDomains.no_bounded_wandering_domains_transcendental_entire
    module: Solution
    status: proved
    note: Same declaration name and exact statement as in the earlier challenge.
  - source: Finite-type transcendental entire no-wandering corollary
    lean: BoundedWanderingDomains.no_wandering_domains_transcendental_entire_finite_singularValues
    module: Solution
    status: proved
    note: A finite spherical singular set has empty derived set, contradicting Theorem 1.4.
  - source: Compact-surface no-wandering corollary
    lean: SurfaceDynamics.no_wandering_domains_compact
    module: Solution
    status: proved
    note: Apply Theorem 1.3(1) with the compact set equal to the whole source surface.
  - source: Rational no-wandering corollary
    lean: SurfaceDynamics.no_wandering_domains_rational
    module: Solution
    status: proved
    note: Specialise the compact-surface theorem to the whole Riemann sphere, including infinity.
