  status: "self-assessed"
  reviewers: []
  notes: >-
    Local Lean compilation and standard-axiom checks are recorded in VERIFICATION.md.
    The local declaration audit compares exported elaborated types and definition
    bodies from the two separate environments. It is not Palomar Comparator or
    NanoDa. No public submission, external Comparator run, registry acceptance or
    independent human review is claimed.

