status:
  scope: >-
    All challenge targets are proved in Solution.lean. The original entire-function bounded-orbit theorem is retained unchanged and selected for comparison. Compact sets
    in Theorem 1.3 lie inside the actual open source. Simple connectivity is assumed
    only in Theorem 1.5; removal of this assumption using an argument of Baker–Kotus–Lü is still outstanding. The positive-area theorem assumes a measurable set in
    trapped minus omega, disjoint forward images, and injectivity on its saturation.
    Meromorphic normal form allows poles; admissible Fatou components avoid poles
    and prepoles. Theorem 1.5 concerns compact escape in the ambient surface or
    accumulation at the derived singular set of the actual local map. Independent
    Challenge placeholders are excluded from the proof dependency closure.
    Three additional selected corollaries exclude wandering domains for compact
    surface self-maps, rational maps in the intrinsic holomorphic-sphere
    formulation, and finite-type transcendental entire functions. Polynomials
    are included as rational maps. No finite-type meromorphic no-wandering
    theorem is asserted; this generalisation is deferred.
