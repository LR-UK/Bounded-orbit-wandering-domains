    extends the local results to arbitrary Riemann surfaces, adds the positive-area result and classical
    no-wandering corollaries. Surface derived-set accumulation now applies without a simple-connectivity
    hypothesis, by an adaptation of the Baker–Kotus–Lü argument. The exact independent statements are
    in Challenge.lean, with proofs exposed by Solution.lean. The authors of [PRW] and [DPU] are preparing
    a joint preprint containing these results. No independent human review or acceptance of this updated
    package is claimed.
