version: v0.4
project:
  name: Absence of bounded-orbit wandering domains
  description: >-
    We formalise the recently proved absence of bounded-orbit wandering domains for transcendental entire and meromorphic functions, as well as a corresponding result for 
    locally defined functions. This second version of the formalisation includes the meromorphic case, a local version for maps on Riemann surfaces, the fact that 
    orbits in wandering domains of entire functions must accumulate on limit points of singular values, as well as a local version of this result also (which currently requires 
    simple connectivity of the domains, although it seems likely that this hypothesis can be removed by applying
    additional classical arguments by Baker, Kotus and Lü that are not yet normalised.) For further background,
    see the README.md documentation.
  authors:
  - Nikolai Prochorov
  - Lasse Rempe
  - James Waterman
  # Included third-party code retains its own licences; see THIRD_PARTY_NOTICES.md
  # and the bundled licence texts. This field records the project licence.
  license: Apache-2.0
  responsible_maintainers:
  - Lasse Rempe
