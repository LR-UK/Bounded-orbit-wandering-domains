fidelity:
  divergences: There is no remaining metric-existence or area-formula hypothesis. Curvature is minus one
    and area is divided by 2*pi. The local theorem treats total functions on C required analytic near
    closure(V); its simply connected trapped-component orbit lies in one compact subset of V and satisfies
    radius-dependent eventual injectivity. The entire theorem assumes only one bounded point orbit and
    derives the auxiliary properties needed for its proof. Fatou normality is formulated by locally uniform
    subsequential convergence into the one-point compactification of C, with its compact Hausdorff uniformity;
    the map itself is never evaluated at infinity. The short supporting definitions are compared explicitly.
