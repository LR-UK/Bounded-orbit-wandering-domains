# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Conditional absence of bounded wandering component orbits"
  description: >-
    A Lean formalisation of a local hyperbolic-area argument and its application
    to bounded orbits of Fatou components of transcendental entire functions.
    Both theorems explicitly assume the classical finite-puncture metric facts,
    simple connectivity, and eventual injectivity on every fixed intrinsic disc.
    The entire-function statement uses actual Fatou components and a single
    bound on their union. This repository contains the substantive proof development.
  authors: ["Nikolai Prochorov", "Lasse Rempe", "James Waterman"]
  license: "Apache-2.0"
  responsible_maintainers: ["Lasse Rempe"]

classification:
  arxiv: ["math.DS", "math.CV"]
  msc2020: ["37F10", "30D05", "30F45"]

sources:
  - title: "Local hyperbolic-area argument for compactly contained wandering component orbits"
    type: "conversation and working proof"
    relationship: "formalizes"
    contributors:
      - name: "Lasse Rempe"
        role: "Mathematical direction, conjectures, proof discussion and normalisation"
      - name: "OpenAI ChatGPT/Codex"
        role: "AI-assisted proof development and Lean implementation"
    location: "Working discussion and formalisation, September 2026"
    note: >-
      The associated paper is co-authored by Nikolai Prochorov, Lasse Rempe
      and James Waterman.
      The precise conditional statements are recorded independently in Challenge.lean.
      This is a development of the working argument, not a claim that the unrestricted
      bounded-orbit wandering-domain problem has been resolved. No independent
      human review or priority claim is recorded.
  - title: "A new proof of no-wandering domain theorems without quasiconformal techniques"
    authors: ["Zihao Ye"]
    id: "https://arxiv.org/abs/2609.23834v1"
    type: "preprint"
    relationship: "background"
    note: >-
      Motivation for the use of hyperbolic area in the initial discussion.
      The compared results are the subsequent local conditional statements;
      this submission does not claim to formalise all of Ye's assertions.
  - title: "Absence of wandering domains for some real entire functions with bounded singular sets"
    authors: ["Helena Mihaljević-Brandt", "Lasse Rempe-Gillen"]
    id: "https://doi.org/10.1007/s00208-013-0936-z"
    type: "journal article"
    relationship: "background"
    note: "Proposition 3.4 records the hyperbolic-density comparison discussed in the working proof."
  - title: "Quotients of hyperbolic metrics"
    authors: ["David Minda"]
    id: "https://doi.org/10.1007/s40315-017-0195-1"
    type: "journal article"
    relationship: "background"
    note: "Background for comparison of hyperbolic metrics; not a trusted axiom."

