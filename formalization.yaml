status:
  scope: All nineteen selected challenge targets are proved and exposed by Solution.lean. The original
    entire-function bounded-orbit theorem retains its exact name and statement. Local wandering-component
    results have no simple-connectivity or injectivity hypothesis; the Baker–Kotus–Lü adaptation is complete.
    The positive-area and almost-everywhere results concern measurable sets in trapped minus omega, with
    disjoint forward images and injective iterates. The original compact-source formulation is retained
    alongside an ambient compact-set exclusion away from derived singular values and the corresponding
    almost-everywhere subsequence conclusions. Nullity is checked in every chart. Compact wandering orbits
    have a derived-singular limit in the same compact set. Escape is a subsequence conclusion, not eventual
    escape of the full orbit. Meromorphic normal form allows poles; admissible Fatou components avoid
    poles and prepoles. Classical no-wandering corollaries cover rational maps, compact-surface self-maps
    and class S transcendental entire and meromorphic functions. All follow from the general finite-type
    theorem on an arbitrary open subset of a compact ambient Riemann surface. Independent Challenge placeholders
    are excluded from the proof dependencies. The combined componentwise encounter theorem is the common
    source of the main results. The meromorphic derived-singular conclusion is exported explicitly with
    the compact sphere as ambient target. Obsolete independent main proof branches have been removed.
