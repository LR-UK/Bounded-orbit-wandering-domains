version: "v0.4"

project:
  name: "Conditional absence of bounded-orbit wandering domains"
  description: >-
    We prove that transcendental entire functions do not have bounded-orbit wandering domains.
    This answers a major open question in the field.
    The proof builds upon Zihao Ye's new proof of Sullivan's No Wandering Domains theorem, and
    was obtained with assistance by generative AI, specifically ChatGPT 6 Astra.
    We also formalise a stronger theorem, which shows that locally defined holomorphic functions
    do not have wandering domains on which the iterates are univalent.
    The formalisations are conditional on classical statements concerning the hyperbolic metrics
    of finitely punctured spheres which are well-known, but not yet formalised. Hence the theorems
    contain the existence of hyperbolic metrics on the corresponding punctures spheres as a
    hypothesis.
  authors: ["Nikolai Prochorov", "Lasse Rempe", "James Waterman"]
  license: "Apache-2.0"
  responsible_maintainers: ["Lasse Rempe"]

