status:
  scope: The entire-function theorem rules out a pairwise disjoint forward orbit of actual Fatou components
    when one point in the initial component has a bounded forward orbit. No boundedness of the union of
    Fatou components is assumed. Simple connectivity and eventual intrinsic-disc injectivity are derived
    for auxiliary trapped components in the entire proof. They remain explicit hypotheses only in the
    local theorem, alongside compact containment in an analytic neighbourhood. The former classical hyperbolic
    metric input is now proved from formalised uniformisation, covering theory, cusp estimates, Green's
    identity and the total-area formula. The derived-singular-set statement is not included. Challenge.lean
    has two intentional theorem holes and is not imported by Solution.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: BoundedWanderingDomains.no_local_bounded_wandering_domains
    file: Solution.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - declaration: BoundedWanderingDomains.no_bounded_wandering_domains_transcendental_entire
    file: Solution.lean
    sorry_count: 0
    axioms:
