status:
  scope: >-
    Two conditional absence results are proved: local trapped components compactly
    contained in an analytic neighbourhood, and genuine Fatou-component orbits of
    a transcendental entire function with a uniformly bounded union. Both retain
    simple connectivity and eventual injectivity on each fixed intrinsic disc;
    the starting time may depend on the radius. ClassicalHyperbolicMetrics is an
    explicit theorem hypothesis. All area-deficit, limiting-density and dynamical
    deductions are proved. No derived-singular-set theorem, unrestricted bounded
    wandering-domain theorem, or pointwise-bounded-orbit theorem is claimed.
    Challenge.lean has two intentional proof holes and is not imported by Solution.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "BoundedWanderingDomains.no_local_bounded_wandering_domains"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "BoundedWanderingDomains.no_bounded_wandering_domains_transcendental_entire"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]

