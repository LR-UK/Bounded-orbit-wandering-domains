name = "area_deficit"
version = "1.3.0"
defaultTargets = ["Submission", "Challenge", "NewResults", "SingularLimitsChallenge", "SingularLimitsSolution", "SurfaceResearch"]

[[require]]
name = "complexApproximation"
path = "dependencies/ComplexApproximation"

[[require]]
name = "eremenkosConjecture"
path = "dependencies/EremenkosConjecture"

[[lean_lib]]
name = "Submission"
roots = ["Solution"]

[[lean_lib]]
name = "Challenge"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[require]]
name = "functionTheory"
path = "dependencies/FunctionTheory"

[[require]]
name = "complexDynamics"
path = "dependencies/ComplexDynamics"

[[lean_lib]]
name = "BoundedWanderingDomains"

[[lean_lib]]
name = "CoveringSolution"

[[lean_lib]]
name = "RiemannDynamics"
roots = ["RiemannDynamics.BoundedWanderingSolution"]
globs = ["RiemannDynamics.+"]

[[lean_lib]]
name = "RMT4"

[[lean_lib]]
name = "EremenkoLyubichConstant"

[[lean_lib]]
name = "Ray"

[[lean_lib]]
name = "NewResults"

[[lean_lib]]
name = "SingularLimitsChallenge"

[[lean_lib]]
name = "SingularLimitsSolution"

[[lean_lib]]
name = "SurfaceResearch"

[[lean_lib]]
name = "SurfaceGeometry"

[[lean_lib]]
name = "SurfaceFiniteRemoval"

[[lean_lib]]
name = "SurfaceKernel"

[[lean_lib]]
name = "SurfaceDynamicsTargets"

[[lean_lib]]
name = "PaperChallenge"

[[lean_lib]]
name = "PaperSolution"
